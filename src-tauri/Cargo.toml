[package]
name = "scdesktop"
version = "0.1.0"
description = "Personal SoundCloud desktop client for Windows (fork of zxcloli666/SoundCloud-Desktop)"
authors = ["eidetism", "zxcloli666"]
license = "MIT"
edition = "2024"

[lib]
name = "scdesktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
dirs = "6"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["clock"] }
regex = { version = "1", default-features = false, features = ["std"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "mp4"] }
cpal = "0.17"
souvlaki = "0.8"
raw-window-handle = "0.6"
discord-rich-presence = "1"
windows-registry = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "socks", "gzip", "brotli", "json", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }
webview2-com = { version = "0.39", default-features = false }
windows = { version = "0.62", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-platform-verifier = "0.6"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
